<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <!-- 文件夾＋正在書寫的筆，構圖同 icon.svg。單色圖示分不出筆與文件夾外框，改靠 mask 沿筆的輪廓挖一圈透明縫。
       檔名換掉是為了繞過 VS Code 同版號重裝時的圖示快取。 -->
  <defs>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect width="16" height="16" fill="#fff"/>
      <g transform="translate(5.5 11.5) rotate(-45)" fill="#000" stroke="#000" stroke-width="1.6" stroke-linejoin="round">
        <path d="M0 0 L2.2 -1.3 L2.2 1.3 Z"/>
        <rect x="2.2" y="-1.3" width="7" height="2.6" rx=".4"/>
        <rect x="9.2" y="-1" width="1.5" height="2" rx=".3"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <path d="M1.5 3.5 H6 L7.5 5 H14.5 V13 H1.5 Z"/>
    <path d="M2.4 11.5 q.7 -1 1.4 0" stroke-width="1"/>
  </g>
  <g transform="translate(5.5 11.5) rotate(-45)" fill="currentColor" stroke="none">
    <path d="M0 0 L2.2 -1.3 L2.2 1.3 Z"/>
    <rect x="2.2" y="-1.3" width="7" height="2.6" rx=".4"/>
    <rect x="9.2" y="-1" width="1.5" height="2" rx=".3"/>
  </g>
</svg>
